[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
SkinWidth=#SCREENAREAWIDTH#
SkinHeight=28

[Metadata]
Name=MacTopBar
Author=macify-windows
Information=Unified macOS Top Menu & Status Bar for Windows 11
Version=1.0.0
License=MIT

[Variables]
FontName=Segoe UI Variable Display, Inter, Segoe UI, Arial
FontSize=9
BarHeight=28
BarColor=22,22,25,230
BorderColor=55,55,62,180
TextLight=240,240,245,240
TextMuted=170,170,180,200
TextDim=120,120,130,160
AccentColor=0,122,255,255

; ==============================================================================
; MEASURES (System Stats, Time & Controls)
; ==============================================================================
[MeasureTime]
Measure=Time
Format="%a %b %d  %#I:%M %p"

[MeasureBatteryPercent]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Percent

[MeasureBatteryStatus]
Measure=Plugin
Plugin=PowerPlugin
PowerState=Status

[MeasureAudioVolume]
Measure=Plugin
Plugin=Win7AudioPlugin

; ==============================================================================
; BACKGROUND & BORDER
; ==============================================================================
[MeterBackground]
Meter=Image
SolidColor=#BarColor#
X=0
Y=0
W=#SCREENAREAWIDTH#
H=#BarHeight#

[MeterBottomBorder]
Meter=Image
SolidColor=#BorderColor#
X=0
Y=(#BarHeight#-1)
W=#SCREENAREAWIDTH#
H=1

; ==============================================================================
; LEFT MENU ITEMS (Apple Logo, App Name & Finder Menus)
; ==============================================================================
[MeterAppleLogo]
Meter=String
Text=""
FontFace=#FontName#
FontSize=11
FontColor=#TextLight#
AntiAlias=1
X=12
Y=4
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('^{ESC}')"]
ToolTipText="Apple Menu (Start / System Commands)"

[MeterAppName]
Meter=String
Text="Finder"
FontFace=#FontName#
FontSize=#FontSize#
FontWeight=700
FontColor=#TextLight#
AntiAlias=1
X=34
Y=6
LeftMouseUpAction=["explorer.exe"]
ToolTipText="macOS Finder (File Explorer)"

[MeterMenuFile]
Meter=String
Text="File"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=88
Y=6
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('%f')"]

[MeterMenuEdit]
Meter=String
Text="Edit"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=122
Y=6
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('%e')"]

[MeterMenuView]
Meter=String
Text="View"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=156
Y=6
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('%v')"]

[MeterMenuGo]
Meter=String
Text="Go"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=195
Y=6
LeftMouseUpAction=["explorer.exe" "shell:MyComputerFolder"]

[MeterMenuWindow]
Meter=String
Text="Window"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=223
Y=6
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('#{Tab}')"]

[MeterMenuHelp]
Meter=String
Text="Help"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=278
Y=6
LeftMouseUpAction=["https://github.com/adityalokhande0011/macify-windows"]

; ==============================================================================
; RIGHT STATUS ITEMS (Spotlight, Control Center, Sound, Battery, Clock)
; ==============================================================================
[MeterClock]
Meter=String
MeasureName=MeasureTime
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextLight#
FontWeight=600
AntiAlias=1
X=(#SCREENAREAWIDTH# - 16)
Y=6
StringAlign=Right
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('#n')"]
ToolTipText="Calendar & Notifications"

[MeterBattery]
Meter=String
MeasureName=MeasureBatteryPercent
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 180)
Y=6
StringAlign=Right
Text="%1%"
ToolTipText="Battery Level"

[MeterBatteryIcon]
Meter=String
Text="🔋"
FontFace=#FontName#
FontSize=9
FontColor=#TextLight#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 160)
Y=6
ToolTipText="Power Status"

[MeterVolumeIcon]
Meter=String
Text="🔊"
FontFace=#FontName#
FontSize=9
FontColor=#TextLight#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 225)
Y=6
LeftMouseUpAction=[!CommandMeasure "MeasureAudioVolume" "ToggleMute"]
MouseScrollUpAction=[!CommandMeasure "MeasureAudioVolume" "ChangeVolume +5"]
MouseScrollDownAction=[!CommandMeasure "MeasureAudioVolume" "ChangeVolume -5"]
ToolTipText="Sound (Scroll to Adjust, Click to Mute)"

[MeterWiFiIcon]
Meter=String
Text="􀙇 Wi-Fi"
FontFace=#FontName#
FontSize=#FontSize#
FontColor=#TextMuted#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 275)
Y=6
LeftMouseUpAction=["ms-settings:network"]
ToolTipText="Wi-Fi & Network Settings"

[MeterControlCenter]
Meter=String
Text="􀜊"
FontFace=#FontName#
FontSize=10
FontColor=#TextLight#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 315)
Y=5
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('#a')"]
ToolTipText="macOS Control Center (Quick Settings)"

[MeterSpotlight]
Meter=String
Text="🔍"
FontFace=#FontName#
FontSize=9
FontColor=#TextLight#
AntiAlias=1
X=(#SCREENAREAWIDTH# - 345)
Y=6
LeftMouseUpAction=["powershell.exe" "-ExecutionPolicy" "Bypass" "-Command" "$w=New-Object -ComObject WScript.Shell; $w.SendKeys('%{SPACE}')"]
ToolTipText="macOS Spotlight Search (Alt+Space / Win+Space)"
